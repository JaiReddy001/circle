  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }

  .avatar { width: 42px; height: 42px; border-radius: 50%; background: #e4e6eb; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }

  .post-actions { display: flex; gap: 6px; border-top: 1px solid #e4e6eb; padding-top: 8px; }

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const timeAgo = iso => {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  return Math.floor(s/86400) + 'd';
};

// ---------- auth ----------
async function init() {
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_e, s) => { session = s; render(); });
  render();
}

async function render() {
  const signedIn = !!session;
  $('authBox').hidden = signedIn;
  $('authBtn').hidden = false;
  $('authBtn').textContent = signedIn ? 'Sign out' : 'Sign in';
  $('userLabel').textContent = '';
  if (!signedIn) {
    $('profileBox').hidden = true; $('appBox').hidden = false;
    $('composer').hidden = true; $('signedOutNotice').hidden = false;
    myProfile = null; unsubscribeChat(); $('notifBanner').hidden = true; loadFeed(); return;
  }
  const { data } = await sb.from('profiles').select('*').eq('user_id', session.user.id).maybeSingle();
  myProfile = data || null;
  $('profileBox').hidden = !!myProfile;
  $('appBox').hidden = !myProfile;
  $('composer').hidden = !myProfile;
  $('signedOutNotice').hidden = true;
  if (myProfile) { $('userLabel').textContent = myProfile.avatar_emoji + ' ' + myProfile.display_name; loadFeed(); subscribeChat(); } refreshNotifBanner();
}

$('authBtn').onclick = async () => {
  if (session) { await sb.auth.signOut(); }
  else { $('authBox').hidden = false; $('authBox').scrollIntoView(); }
};
$('tabIn').onclick = () => setMode('in');
$('tabUp').onclick = () => setMode('up');
function setMode(m) {
  mode = m;
  $('tabIn').classList.toggle('active', m === 'in');
  $('tabUp').classList.toggle('active', m === 'up');
  $('authGo').textContent = m === 'in' ? 'Sign in' : 'Sign up';
  $('authErr').textContent = '';
}
$('authGo').onclick = async () => {
  $('authErr').textContent = '';
  const email = $('email').value.trim(), password = $('password').value;
  if (!email || !password) { $('authErr').textContent = 'Enter email and password.'; return; }
  $('authGo').disabled = true;
  try {
    if (mode === 'in') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;

      const { data, error } = await sb.auth.signUp({ email, password });

  $('authGo').disabled = false;

// ---------- profile ----------
EMOJIS.forEach(e => {
  const s = document.createElement('span');
  s.textContent = e; if (e === pickedEmoji) s.classList.add('sel');
  s.onclick = () => { pickedEmoji = e; document.querySelectorAll('#emojiPick span').forEach(x => x.classList.remove('sel')); s.classList.add('sel'); };

$('saveProfile').onclick = async () => {

  if (error) { $('profileErr').textContent = error.message; return; }

// ---------- feed (client-side joins: separate simple queries, merged in JS) ----------
function showTab(which) {
  for (const [btn, view] of [['tabFeed', 'feed'], ['tabPeople', 'people'], ['tabChat', 'chat']]) {
    $(btn).classList.toggle('active', which === view);
    $(view).hidden = which !== view;
  }
  const inFeed = which === 'feed';
  document.querySelector('.refresh').style.display = inFeed ? '' : 'none';
  $('composer').hidden = !inFeed || !myProfile;
  if (which === 'people') loadPeople();
  if (which === 'chat') openChatList();
}
$('tabFeed').onclick = () => showTab('feed');
$('tabPeople').onclick = () => showTab('people');
$('tabChat').onclick = () => showTab('chat');
$('refreshBtn').onclick = loadFeed;

async function profileMapFor(ids) {
  const map = {};
  const uniq = [...new Set(ids)].filter(Boolean);
  if (!uniq.length) return map;
  const { data, error } = await sb.from('profiles').select('id, display_name, avatar_emoji').in('id', uniq);
  if (error) throw error;
  (data || []).forEach(p => { map[p.id] = p; });
  return map;
}

async function loadFeed() {
  const y = window.scrollY; // remember screen position so reloads don't jump
  try {
    const { data: posts, error } = await sb.from('posts')
      .select('id, body, profile_id, created_at, media_url, media_type')
      .order('created_at', { ascending: false }).limit(50);
    if (error) throw error;
    const ids = posts.map(p => p.id);
    const pmap = await profileMapFor(posts.map(p => p.profile_id));
    let likes = [], comments = [];
    if (ids.length) {
      const lr = await sb.from('post_likes').select('post_id, profile_id').in('post_id', ids);
      if (lr.error) throw lr.error; likes = lr.data || [];
      const cr = await sb.from('comments').select('post_id').in('post_id', ids);
      if (cr.error) throw cr.error; comments = cr.data || [];
    }
    const likeCount = {}, likedByMe = {}, commentCount = {};
    likes.forEach(l => { likeCount[l.post_id] = (likeCount[l.post_id]||0)+1; if (myProfile && l.profile_id === myProfile.id) likedByMe[l.post_id] = true; });
    comments.forEach(c => { commentCount[c.post_id] = (commentCount[c.post_id]||0)+1; });
    $('feed').innerHTML = posts.length ? '' : '<div class="card muted">No posts yet — be the first to share something!</div>';
    posts.forEach(p => $('feed').appendChild(renderPost(p, pmap[p.profile_id], likeCount[p.id]||0, !!likedByMe[p.id], commentCount[p.id]||0)));
    // Re-open comment threads that were open before the refresh (elements are in the DOM now)
    [...openComments].forEach(pid => {
      const b = document.querySelector('#post-' + pid + ' .comments');
      if (b && b.hidden) { b.hidden = false; loadCommentsInto(pid); }
    });
  } catch (e) {
    $('feed').innerHTML = '<div class="card">Could not load feed: ' + esc(e.message) + '</div>';
  } finally {
    window.scrollTo(0, y); // restore screen position
  }
}

function renderPost(p, author, nLikes, liked, nComments) {
  const a = author || { display_name: 'Someone', avatar_emoji: '🙂' };
  const mine = !!(myProfile && p.profile_id === myProfile.id);
  const d = document.createElement('div');
  d.className = 'card'; d.id = 'post-' + p.id;
  d.innerHTML =
    '<div class="post-head"><div class="avatar">' + esc(a.avatar_emoji) + '</div>' +
    '<div><div class="name">' + esc(a.display_name) + '</div><div class="time">' + timeAgo(p.created_at) + '</div></div></div>' +
    '<div class="post-body">' + esc(p.body) + '</div>' +
    (p.media_url && p.media_type === 'photo' ? '<img class="post-media" src="' + esc(p.media_url) + '" alt="Photo" loading="lazy">' : '') +
    '<div class="post-actions">' +
      '<button data-like class="' + (liked ? 'liked' : '') + '"' + (myProfile ? '' : ' disabled') + '>👍 Like' + (nLikes ? ' (' + nLikes + ')' : '') + '</button>' +
      '<button data-comments>💬 Comments' + (nComments ? ' (' + nComments + ')' : '') + '</button>' +
      (mine ? '<button data-edit>✏️ Edit</button><button data-del class="danger">🗑️ Delete</button>' : '') +
    '</div><div class="comments" hidden></div>';
  d.querySelector('[data-like]').onclick = () => toggleLike(p.id, liked);
  d.querySelector('[data-comments]').onclick = () => toggleComments(p.id);
  if (mine) {
    d.querySelector('[data-edit]').onclick = () => startPostEdit(p, d.querySelector('.post-body'));
    d.querySelector('[data-del]').onclick = () => deletePost(p);
  }
  return d;
}

function startPostEdit(p, bodyEl) {
  bodyEl.innerHTML = '';
  const ta = document.createElement('textarea');
  ta.value = p.body; ta.maxLength = 500; ta.rows = 3;
  const row = document.createElement('div'); row.className = 'edit-row';
  const saveBtn = document.createElement('button'); saveBtn.className = 'btn'; saveBtn.textContent = 'Save';
  const cancelBtn = document.createElement('button'); cancelBtn.className = 'btn ghost'; cancelBtn.textContent = 'Cancel';
  saveBtn.onclick = async () => {
    const v = ta.value.trim();
    if (!v || v === p.body) { loadFeed(); return; }
    saveBtn.disabled = true;
    const { error } = await sb.from('posts').update({ body: v }).eq('id', p.id);
    if (error) { alert('Could not save edit: ' + error.message); saveBtn.disabled = false; return; }
    loadFeed();
  };
  cancelBtn.onclick = () => loadFeed();
  row.appendChild(saveBtn); row.appendChild(cancelBtn);
  bodyEl.appendChild(ta); bodyEl.appendChild(row);
  ta.focus();
}

async function deletePost(p) {
  if (!confirm('Delete this post? Its comments and likes will be removed too.')) return;
  if (p.media_url) {
    const parts = String(p.media_url).split('/storage/v1/object/public/media/');
    if (parts[1]) await sb.storage.from('media').remove([parts[1]]);
  }
  const { error } = await sb.from('posts').delete().eq('id', p.id);
  if (error) { alert('Could not delete: ' + error.message); return; }
  loadFeed();
}

// ---------- photo picker + upload ----------
let pickedPhoto = null;

function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height;
      const s = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? resolve(b) : reject(new Error('Could not compress photo')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that photo')); };
    img.src = url;
  });
}

$('photoInput').onchange = async () => {
  const f = $('photoInput').files[0];
  if (!f) return;
  if (!f.type.startsWith('image/')) { alert('Please pick a photo file.'); $('photoInput').value = ''; return; }
  if (f.size > 15 * 1024 * 1024) { alert('That photo is too large (max 15MB).'); $('photoInput').value = ''; return; }
  try {
    pickedPhoto = await compressImage(f, 1600, 0.82);
    $('photoImg').src = URL.createObjectURL(pickedPhoto);
    $('photoPreview').hidden = false;
  } catch (e) {
    alert(e.message || 'Could not read that photo.');
    $('photoInput').value = '';
  }
};

$('photoRemove').onclick = () => {
  pickedPhoto = null;
  $('photoInput').value = '';
  $('photoPreview').hidden = true;
};

async function toggleLike(postId, wasLiked) {
  if (!myProfile) return;
  if (wasLiked) await sb.from('post_likes').delete().eq('post_id', postId).eq('profile_id', myProfile.id);
  else await sb.from('post_likes').insert({ post_id: postId, profile_id: myProfile.id });
  loadFeed();
}

async function loadCommentsInto(postId) {
  const box = document.querySelector('#post-' + postId + ' .comments');
  box.innerHTML = '<div class="muted">Loading…</div>';
  const { data, error } = await sb.from('comments')
    .select('id, body, profile_id, created_at')
    .eq('post_id', postId).order('created_at', { ascending: true });
  if (error) { box.innerHTML = '<div class="err">' + esc(error.message) + '</div>'; return; }
  const pmap = await profileMapFor((data || []).map(c => c.profile_id));
  box.innerHTML = '';
  (data || []).forEach(c => {
    const a = pmap[c.profile_id] || { display_name: 'Someone', avatar_emoji: '🙂' };
    const mineC = !!(myProfile && c.profile_id === myProfile.id);
    const r = document.createElement('div');
    r.className = 'comment';
    r.innerHTML = '<div class="avatar">' + esc(a.avatar_emoji) + '</div><div class="bubble"><div class="name">' + esc(a.display_name) + '</div><span class="ctext">' + esc(c.body) + '</span>' +
      (mineC ? '<span class="c-actions"><button data-cedit title="Edit">✏️</button><button data-cdel title="Delete">🗑️</button></span>' : '') + '</div>';
    if (mineC) {
      r.querySelector('[data-cedit]').onclick = () => startCommentEdit(c, r);
      r.querySelector('[data-cdel]').onclick = async () => {
        if (!confirm('Delete this comment?')) return;
        const { error } = await sb.from('comments').delete().eq('id', c.id);
        if (error) { alert('Could not delete: ' + error.message); return; }
        loadCommentsInto(c.post_id); loadFeed();
      };
    }
    box.appendChild(r);
  });
  if (myProfile) {
    const row = document.createElement('div');
    row.className = 'comment-row';
    row.innerHTML = '<input type="text" placeholder="Write a comment…" maxlength="300"><button class="btn">Send</button>';
    const input = row.querySelector('input');
    const send = async () => {
      const body = input.value.trim(); if (!body) return;
      await sb.from('comments').insert({ post_id: postId, profile_id: myProfile.id, body });
      loadCommentsInto(postId); loadFeed();
    };
    row.querySelector('button').onclick = send;
    input.onkeydown = e => { if (e.key === 'Enter') send(); };
    box.appendChild(row);
  } else {
    const n = document.createElement('div'); n.className = 'muted'; n.textContent = 'Sign in to join the conversation.'; box.appendChild(n);
  }
}

function startCommentEdit(c, rowEl) {
  const bubble = rowEl.querySelector('.bubble');
  const nameEl = rowEl.querySelector('.name');
  bubble.innerHTML = nameEl ? nameEl.outerHTML : '';
  const input = document.createElement('input');
  input.type = 'text'; input.value = c.body; input.maxLength = 300;
  const row = document.createElement('div'); row.className = 'edit-row';
  const saveBtn = document.createElement('button'); saveBtn.className = 'btn'; saveBtn.textContent = 'Save';
  const cancelBtn = document.createElement('button'); cancelBtn.className = 'btn ghost'; cancelBtn.textContent = 'Cancel';
  saveBtn.onclick = async () => {
    const v = input.value.trim();
    if (!v || v === c.body) { loadCommentsInto(c.post_id); return; }
    saveBtn.disabled = true;
    const { error } = await sb.from('comments').update({ body: v }).eq('id', c.id);
    if (error) { alert('Could not save edit: ' + error.message); saveBtn.disabled = false; return; }
    loadCommentsInto(c.post_id); loadFeed();
  };
  cancelBtn.onclick = () => loadCommentsInto(c.post_id);
  row.appendChild(saveBtn); row.appendChild(cancelBtn);
  bubble.appendChild(input); bubble.appendChild(row);
  input.focus();
}

function toggleComments(postId) {
  const box = document.querySelector('#post-' + postId + ' .comments');
  if (!box) return;
  if (!box.hidden) { box.hidden = true; openComments.delete(postId); return; }
  openComments.add(postId); box.hidden = false;
  loadCommentsInto(postId);
}

$('postBtn').onclick = async () => {
  const body = $('postBody').value.trim();
  if ((!body && !pickedPhoto) || !myProfile) return;
  $('postBtn').disabled = true;
  try {
    let media_url = null, media_type = null;
    if (pickedPhoto) {
      $('uploadStatus').hidden = false;
      $('uploadStatus').textContent = 'Uploading photo…';
      const path = myProfile.id + '/' + crypto.randomUUID() + '.jpg';
      const { error: upErr } = await sb.storage.from('media').upload(path, pickedPhoto, { contentType: 'image/jpeg' });
      if (upErr) throw upErr;
      media_url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
      media_type = 'photo';
    }
    const { error } = await sb.from('posts').insert({ profile_id: myProfile.id, body: body, media_url, media_type });
    if (error) throw error;
    $('postBody').value = '';
    pickedPhoto = null; $('photoInput').value = ''; $('photoPreview').hidden = true;
    $('uploadStatus').hidden = true;
    loadFeed();
  } catch (e) {
    $('uploadStatus').hidden = true;
    alert('Could not post: ' + e.message);
  } finally {
    $('postBtn').disabled = false;
  }
};

async function loadPeople() {
  const { data, error } = await sb.from('profiles').select('display_name, avatar_emoji, bio, created_at').order('created_at', { ascending: true });
  if (error) { $('people').innerHTML = '<div class="err">' + esc(error.message) + '</div>'; return; }
  $('people').innerHTML = '<h3 style="margin-bottom:8px">People</h3>' +
    ((data || []).map(p => '<div class="person"><div class="avatar">' + esc(p.avatar_emoji) + '</div><div><div style="font-weight:600">' + esc(p.display_name) + '</div><div class="muted">' + esc(p.bio || '') + '</div></div></div>').join('') || '<div class="muted">No one here yet.</div>');
}

// ---------- chat (Messenger-style direct messages) ----------
let chatPartner = null, chatChannel = null, chatUnread = 0;

function updateChatBadge() {
  const b = $('chatUnread');
  b.hidden = chatUnread === 0;
  b.textContent = chatUnread > 9 ? '9+' : String(chatUnread);
}

async function openChatList() {
  chatPartner = null;
  $('chatThread').hidden = true;
  $('chatList').hidden = false;
  await loadChatList();
}

async function loadChatList() {
  const box = $('chatList');
  if (!myProfile) { box.innerHTML = '<div class="muted">Sign in to chat.</div>'; return; }
  const { data: profs } = await sb.from('profiles').select('id, display_name, avatar_emoji').neq('id', myProfile.id).order('display_name');
  const { data: msgs } = await sb.from('messages').select('sender_id, receiver_id, body, created_at')
    .or('sender_id.eq.' + myProfile.id + ',receiver_id.eq.' + myProfile.id)
    .order('created_at', { ascending: false }).limit(300);
  const lastBy = {};
  for (const m of (msgs || [])) {
    const other = m.sender_id === myProfile.id ? m.receiver_id : m.sender_id;
    if (!lastBy[other]) lastBy[other] = m;
  }
  const t = id => (lastBy[id] && lastBy[id].created_at) || '';
  const sorted = (profs || []).slice().sort((a, b) => t(b.id) < t(a.id) ? -1 : (t(b.id) > t(a.id) ? 1 : 0));
  box.innerHTML = '<div class="muted" style="margin-bottom:8px">Pick someone to chat with:</div>' +
    (sorted.map(p => {
      const lm = lastBy[p.id];
      const preview = lm ? esc(lm.body).slice(0, 60) : 'Say hello 👋';
      return '<div class="chat-person" data-id="' + p.id + '">' +
        '<span style="font-size:28px">' + esc(p.avatar_emoji || '🙂') + '</span>' +
        '<span><span class="nm">' + esc(p.display_name) + '</span><br><span class="pv">' + preview + '</span></span>' +
        '</div>';
    }).join('') || '<div class="muted">No one here yet.</div>');
  box.querySelectorAll('.chat-person').forEach(el => {
    el.onclick = () => openChat((profs || []).find(p => p.id === el.dataset.id));
  });
}

async function openChat(partner) {
  chatPartner = partner;
  chatUnread = 0; updateChatBadge();
  $('chatList').hidden = true;
  $('chatThread').hidden = false;
  $('chatName').textContent = (partner.avatar_emoji || '🙂') + ' ' + partner.display_name;
  $('chatMessages').innerHTML = '<div class="muted">Loading…</div>';
  const { data, error } = await sb.from('messages').select('*')
    .or('and(sender_id.eq.' + myProfile.id + ',receiver_id.eq.' + partner.id + '),and(sender_id.eq.' + partner.id + ',receiver_id.eq.' + myProfile.id + ')')
    .order('created_at', { ascending: true }).limit(300);
  if (error) { $('chatMessages').innerHTML = '<div class="err">Could not load messages.</div>'; return; }
  $('chatMessages').innerHTML = '';
  (data || []).forEach(appendChatMessage);
}

function appendChatMessage(m) {
  const d = document.createElement('div');
  d.className = 'msg ' + (m.sender_id === myProfile.id ? 'me' : 'them');
  d.innerHTML = esc(m.body) + '<span class="tm">' + timeAgo(m.created_at) + '</span>';
  $('chatMessages').appendChild(d);
  const c = $('chatMessages');
  c.scrollTop = c.scrollHeight;
}

async function sendChat() {
  const body = $('chatInput').value.trim();
  if (!body || !chatPartner || !myProfile) return;
  $('chatInput').value = '';
  const { data, error } = await sb.from('messages')
    .insert({ sender_id: myProfile.id, receiver_id: chatPartner.id, body })
    .select().single();
  if (error) { alert('Could not send: ' + error.message); $('chatInput').value = body; return; }
  appendChatMessage(data);
}

$('chatBack').onclick = () => openChatList();
$('chatSend').onclick = sendChat;
$('chatInput').onkeydown = e => { if (e.key === 'Enter') sendChat(); };

function subscribeChat() {
  if (chatChannel) { sb.removeChannel(chatChannel); chatChannel = null; }
  if (!myProfile) return;
  chatChannel = sb.channel('chat-' + myProfile.id)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages', filter: 'receiver_id=eq.' + myProfile.id },
      payload => {
        const m = payload.new;
        if (chatPartner && m.sender_id === chatPartner.id && !$('chatThread').hidden) {
          appendChatMessage(m);
        } else {
          chatUnread++;
          updateChatBadge();
        }
      })
    .subscribe();
}

function unsubscribeChat() {
  if (chatChannel) { sb.removeChannel(chatChannel); chatChannel = null; }
  chatPartner = null; chatUnread = 0;
  const b = $('chatUnread'); if (b) { b.hidden = true; }
}


// ---------- push notifications ----------
function notifSupported() {
  return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
}

function refreshNotifBanner() {
  const show = !!myProfile && notifSupported() && Notification.permission !== 'denied'
    && !localStorage.getItem('notifEnabled') && !localStorage.getItem('notifDismissed');
  $('notifBanner').hidden = !show;
}

function urlBase64ToUint8Array(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob(b64.replace(/-/g, '+').replace(/_/g, '/') + pad);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function enableNotifications() {
  if (!notifSupported()) { alert('Push notifications are not supported in this browser.'); return; }
  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    let perm = Notification.permission;
    if (perm === 'default') perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      alert('Notifications are blocked. Allow them in your browser settings to get alerts.');
      return;
    }
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    const { endpoint, keys } = sub.toJSON();
    const { error } = await sb.from('push_subscriptions').upsert(
      { profile_id: myProfile.id, endpoint: endpoint, p256dh: keys.p256dh, auth: keys.auth },
      { onConflict: 'endpoint' }
    );
    if (error) throw error;
    localStorage.setItem('notifEnabled', '1');
    refreshNotifBanner();
    alert('Notifications enabled! You will get alerts for new messages, likes and comments.');
  } catch (e) {
    alert('Could not enable notifications: ' + (e.message || e));
  }
}

$('notifBtn').onclick = enableNotifications;

// deep link from a tapped notification: ?chat=<profileId>
async function handleChatDeepLink() {
  const id = new URLSearchParams(location.search).get('chat');
  if (!id || !myProfile) return;
  const { data } = await sb.from('profiles').select('id, display_name, avatar_emoji').eq('id', id).maybeSingle();
  if (data) { showTab('chat'); openChat(data); }
  history.replaceState(null, '', location.pathname);
}

setInterval(() => { if (!$('appBox').hidden && !$('feed').hidden) loadFeed(); }, 30000);
init();
</script>
